name: DuDe
id: dude
version: 1.2.5

actions:
  verify:
    with:
      requirements:
        - name: Java 21+
          min: 21.0.0
          command: java -version
          match:
            - 'version "(?<version>.+)"'
        - name: Python 3.9+
          min: 3.9.0
          command:
            windows: py -3 --version >nul 2>nul & if not errorlevel 1 (py -3 --version) else (python --version)
            unix: if command -v python3 >/dev/null 2>&1; then python3 --version; else python --version; fi
          match:
            - 'Python (?<version>.+)'
  start:
    parameters:
      max-heap: 8g
    environment:
      DUDE_PROJECT_NAME: ${repoName}
      DUDE_PROJECT_FOLDER: ${repo}
    commands:
      run-dude:
        id: run-dude
        dir: ${instrumentPath}
        command: >-
          java -Xmx${max-heap} -jar dude.jar

  summary:
    md-file: results/summary.md
    html-file: results/summary.html
    category: Technology Breakdown
    commands:
      generate-summary:
        id: generate-summary
        dir: ${instrumentPath}
        command:
          windows: py -3 --version >nul 2>nul & if not errorlevel 1 (py -3 dude-summary.py "${instrumentPath}/results") else (python dude-summary.py "${instrumentPath}/results")
          unix: if command -v python3 >/dev/null 2>&1; then python3 dude-summary.py "${instrumentPath}/results"; else python dude-summary.py "${instrumentPath}/results"; fi

  pack:
    with:
      locations:
        - source: ${instrumentDir}/results
          destination: /results
        - source: ${instrumentDir}
          destination: /
          files:
            - ignored_*.csv

  clean:
    with:
      locations:
        - source: ${instrumentDir}/results
